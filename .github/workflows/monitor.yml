name: Podcast Monitor

on:
  schedule:
    - cron: '30 8 * * *'  # 17:30 JST
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install feedparser requests beautifulsoup4

      - run: python monitor.py
